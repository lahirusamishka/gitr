# Builds gitr for Linux on every push to master and publishes:
#   - a portable AppImage (gitr-x86_64.AppImage)
#   - a plain binary tarball (gitr-linux-x86_64.tar.gz)
# to a rolling "latest" GitHub Release.
#
# SETUP NEEDED BEFORE THIS WORKS:
#   1. Save this file at:  .github/workflows/release.yml
#   2. Add an app icon at: packaging/gitr.png   (any square PNG, e.g. 256x256)
#      (or delete the --icon-file line below and linuxdeploy will use a generic one)
#   3. Make sure Cargo.toml's [package] name = "gitr" matches BIN_NAME below.
#   4. No extra secrets needed — GITHUB_TOKEN is provided automatically.

name: release

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  BIN_NAME: gitr

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libssl-dev pkg-config \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev \
            fuse libfuse2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package plain tarball
        run: |
          mkdir -p dist
          tar -czf dist/${BIN_NAME}-linux-x86_64.tar.gz \
            -C target/release ${BIN_NAME}

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps

          cp target/release/${BIN_NAME} AppDir/usr/bin/

          cat > AppDir/usr/share/applications/${BIN_NAME}.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=gitr
          Comment=Compact git commit graph viewer
          Exec=${BIN_NAME}
          Icon=${BIN_NAME}
          Categories=Development;
          Terminal=false
          EOF

          # Generate placeholder icons so linuxdeploy doesn't fail.
          mkdir -p AppDir/usr/share/icons/hicolor/{256x256,48x48,scalable}/apps
          python3 -c "
import struct, zlib
def make_png(w, h, r, g, b):
    raw = b''
    for y in range(h):
        raw += b'\x00' + bytes([r, g, b] * w)
    c = zlib.compress(raw)
    def chunk(t, d):
        return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
    return (b'\x89PNG\r\n\x1a\n' +
        chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) +
        chunk(b'IDAT', c) +
        chunk(b'IEND', b''))
for size, name in [('256x256', 256), ('48x48', 48)]:
    with open(f'AppDir/usr/share/icons/hicolor/{size}/apps/${BIN_NAME}.png', 'wb') as f:
        f.write(make_png(name, name, 137, 180, 250))
"
          # linuxdeploy may look for an SVG in scalable
          ln -sf ../256x256/apps/${BIN_NAME}.png AppDir/usr/share/icons/hicolor/scalable/apps/${BIN_NAME}.png
          # Create the hicolor icon theme index
          cat > AppDir/usr/share/icons/hicolor/index.theme <<THEME
[Icon Theme]
Name=Hicolor
Comment=Fallback icon theme
Directories=48x48/apps;256x256/apps
[48x48/apps]
Size=48
[256x256/apps]
Size=256
THEME

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/${BIN_NAME}.desktop \
            --output appimage

          mv gitr*.AppImage dist/${BIN_NAME}-x86_64.AppImage

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          prerelease: false
          body: |
            Automated build from the latest `master` commit (${{ github.sha }}).
            Download `gitr-x86_64.AppImage` (recommended) or the plain tarball below.
          files: |
            dist/${{ env.BIN_NAME }}-x86_64.AppImage
            dist/${{ env.BIN_NAME }}-linux-x86_64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
