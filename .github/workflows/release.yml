# Builds gitr for Linux on every push to master and publishes:
#   - a portable AppImage (gitr-x86_64.AppImage)
#   - a plain binary tarball (gitr-linux-x86_64.tar.gz)
# to a rolling "latest" GitHub Release.
#
# No extra setup or secrets needed — GITHUB_TOKEN is provided automatically.

name: release

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  BIN_NAME: gitr

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libssl-dev pkg-config \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev \
            fuse libfuse2 imagemagick

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package plain tarball
        run: |
          mkdir -p dist
          tar -czf dist/${BIN_NAME}-linux-x86_64.tar.gz \
            -C target/release ${BIN_NAME}

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications

          cp target/release/${BIN_NAME} AppDir/usr/bin/

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=gitr' \
            'Comment=Compact git commit graph viewer' \
            "Exec=${BIN_NAME}" \
            "Icon=${BIN_NAME}" \
            'Categories=Development;' \
            'Terminal=false' \
            > AppDir/usr/share/applications/${BIN_NAME}.desktop

          # Application icon
          mkdir -p AppDir/usr/share/icons/hicolor/{scalable,256x256,48x48}/apps
          cp packaging/${BIN_NAME}.svg AppDir/usr/share/icons/hicolor/scalable/apps/${BIN_NAME}.svg
          convert -background none -size 256x256 packaging/${BIN_NAME}.svg \
            AppDir/usr/share/icons/hicolor/256x256/apps/${BIN_NAME}.png
          convert -background none -size 48x48 packaging/${BIN_NAME}.svg \
            AppDir/usr/share/icons/hicolor/48x48/apps/${BIN_NAME}.png
          # Create the hicolor icon theme index
          printf '%s\n' \
            '[Icon Theme]' \
            'Name=Hicolor' \
            'Comment=Fallback icon theme' \
            'Directories=scalable/apps;48x48/apps;256x256/apps' \
            '' \
            '[scalable/apps]' \
            'Size=48' \
            'MinSize=16' \
            'MaxSize=512' \
            'Type=Scalable' \
            '' \
            '[48x48/apps]' \
            'Size=48' \
            '' \
            '[256x256/apps]' \
            'Size=256' \
            > AppDir/usr/share/icons/hicolor/index.theme

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/${BIN_NAME}.desktop \
            --output appimage

          mv gitr*.AppImage dist/${BIN_NAME}-x86_64.AppImage

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2.2.2
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          prerelease: false
          body: |
            Automated build from the latest `master` commit (${{ github.sha }}).
            Download `gitr-x86_64.AppImage` (recommended) or the plain tarball below.
          files: |
            dist/${{ env.BIN_NAME }}-x86_64.AppImage
            dist/${{ env.BIN_NAME }}-linux-x86_64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
